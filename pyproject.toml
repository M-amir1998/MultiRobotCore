[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multirobotcore-viz"
version = "0.1.0"
description = "Visualization, orchestration and reporting for the MultiRobotCore C++ library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["multirobotcore_viz"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["python", "scripts"]
extend-exclude = ["build", ".deps", ".venv", "ros2/build", "ros2/install"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL"]
ignore = [
  "PLR0913",  # plotting helpers legitimately take many keyword arguments
  "PLR0915",  # long but linear rendering scripts
  "PLR2004",  # magic values are physical constants in renderers
  "PLR0912",  # frame loops branch on scenario phases
  "PLR0917",  # rendering helpers take several positional arrays
]

[tool.ruff.lint.isort]
known-first-party = ["multirobotcore_viz"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"
