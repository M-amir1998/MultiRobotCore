# Algorithm registry: the source of truth for the README status matrix and
# PROJECT_STATUS.md (generated by scripts/docs/generate_status.py).
#
# Columns are derived from the repository, not asserted:
#   Implemented  the header exists
#   Tested       every listed test path exists
#   Demo         the demo source exists (and its asset, when listed)
#   Benchmark    the benchmark/experiment source exists
#
# Fields: name, area, header, tests, demo, asset, benchmark, docs, reference.

